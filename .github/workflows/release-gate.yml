name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "TDS identity: 24f2008630@ds.study.iitm.ac.in"
        run: |
          echo "Student Identity: 24f2008630@ds.study.iitm.ac.in"
          echo "Release gate policy test execution."

      - name: Run Release Gate Policy Tests
        run: |
          pytest test_release_gate.py -v
